<title id="title">Timewell Spent — school attendance mascot</title>
<desc id="desc">A cheerful blue vintage alarm-clock mascot, with slightly tilted alarm bells, a warm cream face, expressive eyes and smile, dark navy arms and legs, white cartoon gloves, and rounded navy trainers. Hand-built editable SVG based on the smiling pointing pose in the Attendance Matters poster.</desc>
